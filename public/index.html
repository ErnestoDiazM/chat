<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div id="loginForm" class="card p-4 mb-4">
            <h2 class="text-center mb-4">Iniciar Sesión</h2>
            <div class="form-group">
                <input type="text" id="username" class="form-control" placeholder="Ingresa tu nombre de usuario">
                <button onclick="login()" class="btn btn-primary mt-3 w-100">Entrar al Chat</button>
            </div>
        </div>
        <div id="chatContainer" class="card" style="display: none;">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h3 class="mb-0">Chat en Vivo</h3>
                <button onclick="logout()" class="btn btn-danger">Cerrar Sesión</button>
            </div>
            <div class="card-body">
                <div id="messages" class="messages-container mb-3"></div>
                <div class="input-group">
                    <input type="text" id="messageInput" class="form-control" placeholder="Escribe un mensaje...">
                    <button onclick="sendMessage()" class="btn btn-primary">Enviar</button>
                </div>
            </div>
            <div class="card-footer">
                <h5>Usuarios Conectados:</h5>
                <ul id="userList" class="list-unstyled"></ul>
            </div>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="main.js"></script>
</body>
</html>
